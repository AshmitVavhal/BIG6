# SATQUERY AI - GeoChat LoRA / PEFT Fine-Tuning Configuration
# Model & Architecture Configuration
model:
  model_name_or_path: "MBZUAI/geochat-7B"
  processor_name_or_path: "MBZUAI/geochat-7B"
  torch_dtype: "float16"  # "bfloat16", "float16", or "float32"
  device_map: "auto"
  trust_remote_code: true

# PEFT LoRA Parameters
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  # Target attention & MLP linear projection layers in GeoChat LLaMA backbone
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# Supervised Fine-Tuning Hyperparameters
training:
  output_dir: "outputs/satquery-geochat-lora"
  experiments_dir: "experiments"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  gradient_checkpointing: true
  logging_steps: 2
  eval_steps: 10
  save_steps: 20
  save_total_limit: 2
  max_seq_length: 1024
  seed: 42
  fp16: true
  bf16: false
  dataloader_num_workers: 0

# Dataset Paths
dataset:
  train_path: "data/finetuning/train.jsonl"
  validation_path: "data/finetuning/validation.jsonl"
  test_path: "data/finetuning/test.jsonl"

# Evaluation Settings
evaluation:
  metrics: ["rouge", "bleu", "exact_match"]
  output_dir: "evaluation"
  generate_html_report: true
